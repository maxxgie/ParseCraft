name: Auto Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "bottom_up_parser_simulator/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: bottom_up_parser_simulator

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - run: choco install innosetup --yes --no-progress

      - name: Bump manifest version
        shell: pwsh
        run: |
          $m = Get-Content manifest.json | ConvertFrom-Json
          $parts = $m.latest_version.Split('.')
          $parts[2] = [int]$parts[2] + 1
          $m.latest_version = $parts -join '.'
          $m.build = "$($m.build + 1)"
          $m.release_date = (Get-Date -Format "yyyy-MM-dd")
          $m | ConvertTo-Json -Depth 5 | Set-Content manifest.json
          "VERSION=$($m.latest_version)" | Out-File -Append $env:GITHUB_ENV

      - run: ./packaging/build.ps1

      - name: Compute installer hash
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "INSTALLER_NAME=$($installer.Name)" | Out-File -Append $env:GITHUB_ENV
          "INSTALLER_SHA256=$hash" | Out-File -Append $env:GITHUB_ENV
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -Append $env:GITHUB_ENV
          $m = Get-Content manifest.json | ConvertFrom-Json
          $m.download_url = "https://github.com/maxxgie/ParseCraft/releases/download/v$env:VERSION/$env:INSTALLER_NAME"
          $m.sha256 = $hash
          $m | ConvertTo-Json -Depth 5 | Set-Content manifest.json

      - name: Commit manifest
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add manifest.json
          git commit -m "Bump version to $env:VERSION" || echo "no changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/maxxgie/ParseCraft.git main

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:VERSION"
          gh release delete $tag -y 2>$null
          gh release create $tag $env:INSTALLER_PATH --title "ParseCraft $env:VERSION" --notes "Automated release"