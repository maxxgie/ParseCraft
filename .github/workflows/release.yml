name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: bottom_up_parser_simulator

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - run: choco install innosetup --yes --no-progress

      - name: Bump manifest version
        shell: pwsh
        run: |
          $m = Get-Content manifest.json | ConvertFrom-Json
          $parts = $m.latest_version.Split('.')
          $parts[2] = [int]$parts[2] + 1
          $m.latest_version = $parts -join '.'
          $version = $m.latest_version
          $m.build = "$($m.build + 1)"
          $m.release_date = (Get-Date -Format "yyyy-MM-dd")
          $m.download_url = "https://github.com/maxxgie/ParseCraft/releases/download/v$version/ParseCraft-$version-Setup.exe"
          $m | ConvertTo-Json -Depth 5 | Set-Content manifest.json
          # Keep version.json in sync so the built app reports the correct
          # version and does not perpetually think an update is available.
          $v = Get-Content version.json | ConvertFrom-Json
          $v.version = $version
          $v.build = $m.build
          $v.release_date = $m.release_date
          $v | ConvertTo-Json -Depth 5 | Set-Content version.json
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV

      - run: ./packaging/build.ps1

      - name: Compute installer hash
        shell: pwsh
        run: |
          $candidates = @(
            "packaging/dist/installer/*.exe",
            "dist/installer/*.exe"
          )
          $installer = $null
          foreach ($pat in $candidates) {
            $found = Get-ChildItem $pat -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $installer = $found; break }
          }
          if (-not $installer) {
            Write-Host "Searching for any installer exe under workspace:"
            Get-ChildItem -Path . -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "Installer not found"
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installer: $($installer.FullName)"
          $installerName = $installer.Name
          "INSTALLER_NAME=$installerName" | Out-File -Append $env:GITHUB_ENV
          "INSTALLER_SHA256=$hash" | Out-File -Append $env:GITHUB_ENV
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -Append $env:GITHUB_ENV
          $m = Get-Content manifest.json | ConvertFrom-Json
          $m.download_url = "https://github.com/maxxgie/ParseCraft/releases/download/v$env:VERSION/$installerName"
          $m.sha256 = $hash
          $m | ConvertTo-Json -Depth 5 | Set-Content manifest.json

      - name: Commit manifest
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add manifest.json version.json packaging/version_info.txt
          if (git diff --cached --quiet) {
            Write-Host "No manifest changes to commit"
            exit 0
          }
          git commit -m "Bump version to $env:VERSION"
          $remote = "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/maxxgie/ParseCraft.git"
          git remote set-url origin $remote
          # Fetch latest and rebase to avoid "cannot lock ref" rejections.
          git fetch origin main 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Fetch failed" }
          git rebase origin/main 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Rebase failed" }
          git push origin main 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Manifest push failed" }

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:VERSION"
          gh release delete $tag -y 2>$null
          gh release create $tag $env:INSTALLER_PATH --title "ParseCraft $env:VERSION" --notes "Automated release"